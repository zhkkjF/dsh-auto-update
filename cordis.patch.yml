# DSH 自动更新：检查更新、静默安装、更新后自动重装插件并恢复设置。
- insert:
    - id: dsh-auto-update
      name: 'dsh-auto-update'
      config:
        # 自动检查更新的间隔（分钟），0 表示定时检查关闭。
        checkIntervalMinutes: 30
        # 发现新版本时是否自动下载并静默安装（true），还是只在设置页提示（false）。
        autoInstall: true
        # 有进行中的任务时是否等待空闲后再安装。
        autoInstallWhenIdle: true
        # 自动安装失败时是否回退为“只提示”。
        fallbackToPrompt: true
        # 更新前保留的快照数量。
        snapshotKeep: 5
        # 安装前是否备份并恢复插件设置（storages 与插件数据目录）。
        restoreSettings: true
        # 恢复策略：overwrite 覆盖为更新前设置，missing-only 只补缺失文件。
        restorePolicy: overwrite
        # 更新后需要一并备份/恢复的 DSH_HOME 插件数据目录。
        dataDirs:
          - dsh-pet
          - dsh-market
          - skills-manager
          - pet-indesktop
          - archive-desk
          - llm-deepseek
          - skill-mcp-manager
          - mcp-bundles
